name: Publish container images

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image names
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Extract FileHoster image metadata
        id: filehoster
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Extract proxy image metadata
        id: proxy
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-proxy
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and publish FileHoster
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.filehoster.outputs.tags }}
          labels: ${{ steps.filehoster.outputs.labels }}

      - name: Build and publish FileHosterProxy
        uses: docker/build-push-action@v7
        with:
          context: .
          file: FileHosterProxy/Dockerfile
          push: true
          tags: ${{ steps.proxy.outputs.tags }}
          labels: ${{ steps.proxy.outputs.labels }}
